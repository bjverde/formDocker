# =====================================================================
# Configurações customizadas do PostgreSQL (config/postgresql.conf)
# =====================================================================
# Para aplicar este arquivo no container "database", descomente a linha
# de volume e comando correspondente no docker-compose.yml.

listen_addresses = '*'
port = 5432
max_connections = 100
shared_buffers = 128MB
timezone = 'America/Sao_Paulo'
log_timezone = 'America/Sao_Paulo'
datestyle = 'iso, dmy'

