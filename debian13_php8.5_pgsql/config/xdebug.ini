; =====================================================================
; Configuração do Xdebug 3.x (Mapeado em /etc/php/8.5/mods-available/xdebug.ini)
; =====================================================================
; Por padrão o Xdebug vem DESATIVADO para maior desempenho.
; Para ATIVAR sem reconstruir a imagem:
;   1. Descomente a linha "zend_extension=xdebug.so" abaixo (remova o ";")
;   2. Reinicie o container: docker-compose restart apache_php
;
; Para PRODUÇÃO, mantenha "zend_extension=xdebug.so" comentado ou "xdebug.mode = off".
; =====================================================================

;zend_extension=xdebug.so

xdebug.mode = develop,coverage,debug
xdebug.start_with_request = yes
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.log = /var/log/apache2/xdebug.log

